# Nginx site config for the MedApp Mini App: serves the built React frontend
# as static files and reverse-proxies /api to the FastAPI backend (uvicorn on 127.0.0.1:8000).
# Telegram requires the Mini App URL to be HTTPS -- run certbot against this
# server_name after this config is in place (see DEPLOY.md section 8).

server {
    listen 80;
    server_name medapp.example.com;

    root /opt/dyzury-bot/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
